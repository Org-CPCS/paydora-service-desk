name: Rollback on EC2

on:
  workflow_dispatch:

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Rollback via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd ~/paydora-service-desk

            # Stay on the main branch while stepping back one commit. The old
            # `git checkout HEAD~1` detached HEAD, which silently broke every
            # later deploy: `git pull origin main` no longer advanced the
            # branch the app was actually running from.
            git checkout main
            git reset --hard HEAD~1

            npm ci --omit=dev

            pm2 restart ecosystem.config.js --update-env

            echo "Rolled back to: $(git rev-parse --short HEAD)"
            echo "Re-run 'Deploy to EC2' on main to roll forward again."
